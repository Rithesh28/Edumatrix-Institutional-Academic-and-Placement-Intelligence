services:
  postgres:
    image: postgres:15
    container_name: edumatrix_postgres
    environment:
      POSTGRES_USER: edumatrix
      POSTGRES_PASSWORD: edumatrix123
      POSTGRES_DB: edumatrix
      TZ: Asia/Kolkata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - edumatrix_network
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: edumatrix_redis
    environment:
      TZ: Asia/Kolkata
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - edumatrix_network
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: edumatrix_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - edumatrix_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  qdrant:
    image: qdrant/qdrant:latest
    container_name: edumatrix_qdrant
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__LOG_LEVEL: INFO
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - edumatrix_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: edumatrix_backend:latest
    container_name: edumatrix_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://edumatrix:edumatrix123@postgres:5432/edumatrix
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: your-super-secret-key-change-this-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      TZ: Asia/Kolkata
      MINIO_HOST: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_SECURE: "False"
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_COLLECTION: files
      QDRANT_VECTOR_SIZE: 384
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
      - minio
      - qdrant
    networks:
      - edumatrix_network
    restart: unless-stopped

  celery-worker:
    image: edumatrix_backend:latest
    container_name: edumatrix_celery_worker
    command: celery -A app.tasks.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql://edumatrix:edumatrix123@postgres:5432/edumatrix
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: your-super-secret-key-change-this-in-production
      ALGORITHM: HS256
      TZ: Asia/Kolkata
      MINIO_HOST: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_SECURE: "False"
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_COLLECTION: files
      QDRANT_VECTOR_SIZE: 384
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - postgres
      - redis
      - minio
      - qdrant
    networks:
      - edumatrix_network
    restart: unless-stopped

  celery-beat:
    image: edumatrix_backend:latest
    container_name: edumatrix_celery_beat
    command: celery -A app.tasks.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql://edumatrix:edumatrix123@postgres:5432/edumatrix
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: your-super-secret-key-change-this-in-production
      ALGORITHM: HS256
      TZ: Asia/Kolkata
      MINIO_HOST: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_SECURE: "False"
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_COLLECTION: files
      QDRANT_VECTOR_SIZE: 384
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - postgres
      - redis
      - minio
      - qdrant
    networks:
      - edumatrix_network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: edumatrix_frontend
    ports:
      - "5173:5173"
    environment:
      TZ: Asia/Kolkata
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - edumatrix_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  qdrant_data:
  # REMOVED: backend_site_packages

networks:
  edumatrix_network:
    driver: bridge